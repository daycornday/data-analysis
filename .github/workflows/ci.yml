name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - run: pip install -r requirements.txt
      - name: 저장소 검사 (금지 문자, 금지어, 폴더 구조)
        run: python scripts/check_repo.py
      - name: 플레이북 문서 형식 검사
        run: python experimentation-playbook/scripts/validate_docs.py
      - name: 폴더별 테스트
        run: |
          for d in */tests; do
            echo "== $d"
            python -m pytest "$d" -q -p no:warnings || exit 1
          done
