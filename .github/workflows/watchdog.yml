name: watchdog

# 격주 자동 발행이 멈췄는지 감시한다. 집 PC가 꺼져 있어도 GitHub 서버에서 돈다.
# 매주 월요일 09:00 (KST) 에 플레이북 마지막 커밋과 블로그 RSS 최신 글 날짜를 보고,
# 15일 넘게 새 글이 없으면 이 저장소에 이슈를 만든다 (GitHub가 이메일로 알려 준다).

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 마지막 발행 날짜 확인
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_DAYS: "15"
        run: |
          python3 - <<'PY'
          import datetime as dt, email.utils, os, subprocess, urllib.request, xml.etree.ElementTree as ET

          now = dt.datetime.now(dt.timezone.utc)
          max_days = int(os.environ["MAX_DAYS"])
          problems = []

          ts = subprocess.check_output(["git", "log", "-1", "--format=%ct", "origin/main"]).decode().strip()
          last_commit = dt.datetime.fromtimestamp(int(ts), dt.timezone.utc)
          commit_days = (now - last_commit).days
          if commit_days > max_days:
              problems.append(f"플레이북: 마지막 커밋 {commit_days}일 전")

          try:
              with urllib.request.urlopen("https://amint9410.tistory.com/rss", timeout=20) as r:
                  root = ET.fromstring(r.read())
              dates = [email.utils.parsedate_to_datetime(i.findtext("pubDate")) for i in root.iter("item")]
              blog_days = (now - max(dates)).days
              if blog_days > max_days:
                  problems.append(f"블로그: 마지막 글 {blog_days}일 전")
          except Exception as e:
              problems.append(f"블로그 RSS 확인 실패: {e}")

          print("problems:", problems)
          if problems:
              title = "지식 발행 자동화가 멈춘 것 같습니다"
              open_titles = subprocess.check_output(["gh", "issue", "list", "--state", "open", "--json", "title", "--jq", ".[].title"]).decode()
              if title not in open_titles:
                  body = chr(10).join("- " + p for p in problems) + chr(10) * 2 + "집 PC 전원, 티스토리 로그인, 작업 스케줄러를 확인하세요."
                  subprocess.check_call(["gh", "issue", "create", "--title", title, "--body", body])
          PY
