site_name: 실험 플레이북
site_description: A/B 테스트와 인과추론 실무 판단 기준 모음
docs_dir: docs
theme:
  name: material
  language: ko
  palette:
    - scheme: default
      toggle: {icon: material/weather-night, name: 어두운 화면}
    - scheme: slate
      toggle: {icon: material/weather-sunny, name: 밝은 화면}
  features:
    - navigation.sections
    - content.code.copy
nav:
  - 처음: index.md
  - 방법 고르기: decision-tree.md
  - 방법론:
      - 검정력과 표본 크기: methods/power-and-sample-size.md
  - 양식:
      - 실험 설계서: forms/experiment-design.md
      - 결과 보고서: forms/results-report.md
  - 로드맵: roadmap.md
exclude_docs: |
  methods/_template.md
markdown_extensions:
  - tables
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
